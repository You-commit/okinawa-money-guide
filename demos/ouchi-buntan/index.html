<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>おうち分担｜家族の家事を見える化</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#203047;--muted:#6e7785;--line:#e6e2d9;--accent:#e97f5c;--accent2:#6ea08d;--soft:#fff2eb;--ok:#2f8f70;--shadow:0 10px 30px rgba(32,48,71,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-weight:800;font-size:22px;letter-spacing:.02em}.pill{background:#203047;color:white;padding:7px 10px;border-radius:999px;font-size:12px}.hero{background:linear-gradient(145deg,#fff,#fff7f2);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{font-size:24px;line-height:1.35;margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 10px}.members{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.member{min-width:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;margin-bottom:8px}.member b{font-size:14px}.member small{display:block;color:var(--muted);margin-top:4px}.bar{height:7px;border-radius:999px;background:#ece9e1;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent2);border-radius:999px}.filters{display:flex;gap:8px;margin:8px 0 12px;overflow:auto}.filter{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.tasks{display:grid;gap:10px}.task{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.check{width:30px;height:30px;border-radius:50%;border:2px solid #cfd4d8;background:white;color:white;font-weight:900}.task.done{opacity:.55}.task.done .check{background:var(--ok);border-color:var(--ok)}.task.done .task-title{text-decoration:line-through}.task-title{font-weight:700;font-size:15px}.task-meta{font-size:12px;color:var(--muted);margin-top:4px}.who{font-size:12px;background:var(--soft);color:#9d4d32;padding:6px 8px;border-radius:999px;font-weight:700}.balance{background:#203047;color:white;border-radius:20px;padding:16px}.balance-row{display:flex;align-items:center;gap:10px;margin-top:10px}.balance-name{width:52px;font-size:13px}.balance-track{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.balance-fill{height:100%;background:#f4b778;border-radius:999px}.balance-pct{width:34px;text-align:right;font-size:12px}.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(488px,calc(100% - 32px));border:0;background:var(--accent);color:white;border-radius:18px;padding:15px 18px;font-weight:800;box-shadow:0 14px 35px rgba(233,127,92,.35)}dialog{border:0;border-radius:22px;padding:0;width:min(460px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(21,30,43,.42)}.modal{padding:18px}.modal h3{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;border:0;border-radius:12px;padding:12px}.cancel{background:#ece9e1;color:var(--ink)}.save{background:var(--ink);color:white}.tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}@media(min-width:700px){body{padding:24px}.app{border:1px solid var(--line);border-radius:28px;background:#fbfaf7;min-height:auto;box-shadow:var(--shadow)}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">おうち分担</div><div class="pill">家族で共有</div></div>
  <section class="hero"><h1>「なんで私ばっかり？」を<br>見える化で減らす。</h1><p>今日の家事・担当・完了状況を、家族みんなでスマホ確認。</p></section>
  <div class="summary"><div class="stat"><b id="todayCount">0</b><span>今日の家事</span></div><div class="stat"><b id="doneCount">0</b><span>完了した家事</span></div></div>

  <section class="section"><h2>今週の家族バランス</h2><div class="members" id="members"></div></section>

  <section class="section"><h2>今日の家事</h2><div class="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="todo">未完了</button><button class="filter" data-filter="done">完了</button></div><div class="tasks" id="tasks"></div></section>

  <section class="section"><h2>負担の偏り</h2><div class="balance"><div style="font-weight:800">今週の担当比率</div><div style="font-size:12px;opacity:.7;margin-top:3px">極端な偏りがないか確認できます</div><div id="balanceRows"></div></div></section>

  <div class="tiny">このデモのデータは端末内（localStorage）だけに保存されます。</div>
</main>
<button class="fab" id="addBtn">＋ 家事を追加</button>
<dialog id="dlg"><form method="dialog" class="modal" id="form"><h3>家事を追加</h3><div class="field"><label>家事名</label><input id="name" placeholder="例：夕食後の食器洗い" required></div><div class="row"><div class="field"><label>担当</label><select id="owner"></select></div><div class="field"><label>時間帯</label><select id="time"><option>朝</option><option>昼</option><option>夕方</option><option>夜</option></select></div></div><div class="field"><label>カテゴリ</label><select id="category"><option>掃除</option><option>料理</option><option>洗濯</option><option>買い物</option><option>子ども</option><option>その他</option></select></div><div class="actions"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save" value="default">追加する</button></div></form></dialog>
<script>
const KEY='ouchi-buntan-v1';
const defaultState={members:[{id:'mama',name:'ママ',color:'#e97f5c'},{id:'papa',name:'パパ',color:'#5b7fa3'},{id:'yui',name:'ゆい',color:'#8f7ab7'}],tasks:[{id:1,name:'朝食の片付け',owner:'papa',time:'朝',category:'料理',done:true},{id:2,name:'洗濯物をたたむ',owner:'mama',time:'夕方',category:'洗濯',done:false},{id:3,name:'お風呂掃除',owner:'yui',time:'夕方',category:'掃除',done:false},{id:4,name:'夕食後の食器洗い',owner:'papa',time:'夜',category:'料理',done:false},{id:5,name:'明日の持ち物チェック',owner:'mama',time:'夜',category:'子ども',done:false}]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;let filter='all';
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const ownerName=id=>state.members.find(m=>m.id===id)?.name||'未定';
function render(){const tasks=state.tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));document.getElementById('todayCount').textContent=state.tasks.length;document.getElementById('doneCount').textContent=state.tasks.filter(t=>t.done).length;document.getElementById('tasks').innerHTML=tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" onclick="toggle(${t.id})">${t.done?'✓':''}</button><div><div class="task-title">${t.name}</div><div class="task-meta">${t.time} ・ ${t.category}</div></div><div class="who">${ownerName(t.owner)}</div></div>`).join('')||'<div class="task"><div></div><div class="task-title">該当する家事はありません</div><div></div></div>';
const counts=Object.fromEntries(state.members.map(m=>[m.id,state.tasks.filter(t=>t.owner===m.id).length]));const max=Math.max(1,...Object.values(counts));document.getElementById('members').innerHTML=state.members.map(m=>`<div class="member"><div class="avatar" style="background:${m.color}">${m.name.slice(0,1)}</div><b>${m.name}</b><small>${counts[m.id]}件担当</small><div class="bar"><i style="width:${counts[m.id]/max*100}%"></i></div></div>`).join('');const total=Math.max(1,state.tasks.length);document.getElementById('balanceRows').innerHTML=state.members.map(m=>{const pct=Math.round(counts[m.id]/total*100);return `<div class="balance-row"><div class="balance-name">${m.name}</div><div class="balance-track"><div class="balance-fill" style="width:${pct}%"></div></div><div class="balance-pct">${pct}%</div></div>`}).join('');}
window.toggle=id=>{const t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
const dlg=document.getElementById('dlg');document.getElementById('addBtn').onclick=()=>dlg.showModal();document.getElementById('cancel').onclick=()=>dlg.close();
const owner=document.getElementById('owner');owner.innerHTML=state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return;state.tasks.push({id:Date.now(),name,owner:owner.value,time:document.getElementById('time').value,category:document.getElementById('category').value,done:false});save();render();dlg.close();e.target.reset()});render();
</script>
</body>
</html>
