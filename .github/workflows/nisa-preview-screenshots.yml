name: NISA Preview Screenshots

on:
  push:
    branches:
      - qa/nisa-preview-screenshots-20261013
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile screenshots
        env:
          PREVIEW_URL: https://c19428a0.okinawa-money-guide.pages.dev/knowledge/nisa-limits-and-future-value
        run: |
          mkdir -p qa-screenshots
          cat > /tmp/capture-nisa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = process.env.PREVIEW_URL;
          const out = path.resolve('qa-screenshots');

          const targets = [
            ['top', 'NISA（少額投資非課税制度）'],
            ['tax', '100万円の利益が出た場合'],
            ['caution', '事前に確認したい'],
            ['frames', 'つみたて投資枠と'],
            ['cases', '2つの枠の活用例'],
            ['points', 'NISAの判断で'],
            ['steps', 'NISAを理解して'],
            ['faq', 'NISAに関する'],
            ['bottom', '投資前に確認しておきたい重要事項'],
          ];

          async function capture(mode, viewport, isMobile) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: 1,
              isMobile,
              hasTouch: isMobile,
              locale: 'ja-JP',
            });
            const page = await context.newPage();

            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => {
              if (m.type() === 'error') errors.push('console: ' + m.text());
            });

            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(2500);

            const metrics = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              bodyScrollWidth: document.body.scrollWidth,
            }));

            await page.screenshot({
              path: path.join(out, `nisa-${mode}-full.png`),
              fullPage: true,
              animations: 'disabled',
            });

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(250);
            await page.screenshot({
              path: path.join(out, `nisa-${mode}-top.png`),
              fullPage: false,
              animations: 'disabled',
            });

            for (const [slug, text] of targets.slice(1)) {
              const locator = page.getByText(text, { exact: false }).first();
              if (await locator.count()) {
                await locator.scrollIntoViewIfNeeded();
                await page.waitForTimeout(300);
                await page.screenshot({
                  path: path.join(out, `nisa-${mode}-${slug}.png`),
                  fullPage: false,
                  animations: 'disabled',
                });
              }
            }

            fs.writeFileSync(
              path.join(out, `nisa-${mode}-metrics.json`),
              JSON.stringify({ url, viewport, metrics, errors }, null, 2)
            );

            await browser.close();
          }

          (async () => {
            await capture('desktop', { width: 1440, height: 900 }, false);
            await capture('mobile', { width: 390, height: 844 }, true);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/capture-nisa.cjs

      - name: Commit QA screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "qa: capture NISA preview screenshots [skip ci]"
          git push origin HEAD:qa/nisa-preview-screenshots-20261013
