name: Branch Verify

on:
  push:
    branches:
      - feature/article-metadata-20261004

jobs:
  verify-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Changed-scope tests
        run: npx vitest run src/AppRouter.test.tsx src/app/seo.test.ts

      - name: Full test suite (diagnostic)
        id: full_current
        continue-on-error: true
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Report full-suite outcome
        if: always()
        run: echo "Feature full-suite outcome=${{ steps.full_current.outcome }}"

  verify-main-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite on main (baseline diagnostic)
        id: full_main
        continue-on-error: true
        run: npm test

      - name: Report baseline outcome
        if: always()
        run: echo "Main full-suite outcome=${{ steps.full_main.outcome }}"
