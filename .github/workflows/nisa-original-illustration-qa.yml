name: NISA original article illustration — strict quality
on:
  push:
    branches:
      - feature/nisa-original-article-illustration-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Compare exact article markup to PR16
        run: |
          git worktree add --detach /tmp/omg-nisa-original d1351a06ff78bb3f07d703706cb8d09c69eb42ed
          node scripts/verify-nisa-original-illustration.mjs
      - name: Lint, build and full test suite
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
      - name: Build original baseline
        run: |
          npm --prefix /tmp/omg-nisa-original ci
          npm --prefix /tmp/omg-nisa-original run build
      - name: Install independent browser
        run: |
          mkdir -p /tmp/omg-playwright
          npm install --prefix /tmp/omg-playwright --no-save playwright@1.58.2
          /tmp/omg-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start both pages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/nisa-feature.log 2>&1 &
          (cd /tmp/omg-nisa-original && npm run preview -- --host 127.0.0.1 --port 4174 --strictPort >/tmp/nisa-baseline.log 2>&1) &
      - name: Assert image loads and original article text is untouched on desktop/mobile
        env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
        run: node scripts/nisa-original-illustration-browser-qa.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nisa-original-illustration-PC-mobile
          path: qa/nisa-illustration/
          if-no-files-found: warn
