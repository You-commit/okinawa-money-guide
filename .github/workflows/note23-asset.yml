name: note23-asset

on:
  push:
    branches:
      - note-issue23-family-chore-app-20260916
    paths:
      - .github/workflows/note23-asset.yml

permissions:
  contents: write

jobs:
  save-approved-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: note-issue23-family-chore-app-20260916
      - name: Download original approved header
        run: |
          mkdir -p note/issue23
          curl -fL 'https://sdmntprseasia.oaiusercontent.com/files/00000000-c8f4-8207-b495-c05a9800fd01/raw?se=2026-09-16T08%3A06%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=07658007-9b43-518f-9b15-1aa8253bfe67&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A46%3A49Z&ske=2026-09-16T22%3A46%3A49Z&sks=b&skv=2026-02-06&sig=MM7FuKnwBPzBvJJyrcj4B3BFbLk9QZEAU37ttVI9ln8%3D' -o note/issue23/approved_header.png
          test -s note/issue23/approved_header.png
      - name: Commit approved header
        run: |
          git config user.name 'note-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add note/issue23/approved_header.png
          git diff --cached --quiet && exit 0
          git commit -m 'Store original approved issue 23 header asset'
          git push
