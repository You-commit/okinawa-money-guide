name: Mortgage simulator regression gate
on:
  push:
    branches:
      - fix/mortgage-trajectory-metadata-20261124
  pull_request:
    paths:
      - "src/MortgageCalculator.tsx"
      - ".github/workflows/mortgage-regression.yml"
jobs:
  full-suite:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and production build
        run: npm run build
      - name: All tests must pass
        run: npm test
