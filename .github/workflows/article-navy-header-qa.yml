name: Article-only navy header acceptance
on:
  push:
    branches: [preview/article-navy-header]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Protect existing article, hero and calculator files
        run: |
          git diff --exit-code 5d0e2b4aa0ca6b2f1b2fd18d44961023f40a6b11 HEAD -- src ':!src/components/top/TopHeader.tsx' ':!src/styles/top-redesign-option02.css' ':!src/AppRouter.test.tsx'
          node scripts/check-editorial-scope.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Browser with Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=ja
          npm install --prefix /tmp/omg-playwright --no-save playwright@1.58.2
          /tmp/omg-playwright/node_modules/.bin/playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/article-header-preview.log 2>&1 &
      - name: Existing chart and navigation regression
        env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
        run: node scripts/nisa-chart-accuracy-qa.mjs
      - name: Deployed header and interaction verification
        env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
        run: node scripts/article-navy-header-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-header-visual-acceptance
          path: |
            qa/article-header/
            qa/nisa-chart/report.json
