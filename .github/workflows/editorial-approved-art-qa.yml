name: Approved editorial artwork and article acceptance
on:
  push:
    branches: [preview/editorial-approved-art]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Protect approved NISA and calculators, restore exact original header
        run: |
          git diff --exit-code 5d0e2b4aa0ca6b2f1b2fd18d44961023f40a6b11 HEAD -- src/components/top/TopHeader.tsx src/styles/top-redesign-option02.css
          git diff --exit-code 27a0e642abe36e136b0ea2fa20c8da0024ebcb93 HEAD -- src ':!src/components/top/TopHeader.tsx' ':!src/styles/top-redesign-option02.css' ':!src/pages/KnowledgePage.tsx' ':!src/pages/knowledge/MortgageComparisonArticlePage.tsx' ':!src/styles/editorial-consistency.css' ':!src/AppRouter.test.tsx' ':!src/app/seo.ts' ':!src/components/knowledge/EditorialIllustration.tsx' ':!src/assets/editorial/*'
          node scripts/check-editorial-scope.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  artwork-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Detect and verify the two approved original images
        id: assets
        shell: bash
        run: |
          a=src/assets/editorial/knowledge-guide-approved.webp
          b=src/assets/editorial/mortgage-comparison-approved.webp
          if [[ ! -f "$a" && ! -f "$b" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Binary image transfer pending; code-only preview is not final."
          else
            printf '%s  %s\n' 7124d00d340473de6d2b5401db095f0a8dc6cfe1656d3f4aa7ccd5180f60c668 "$a" 2459768521342dba2c9ff0d68d319a4aceeefd7787ca606537bd40d825ecc07c "$b" | sha256sum --check
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and install browser and Japanese fonts
        run: |
          npm ci
          npm run build
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/omg-playwright --no-save playwright@1.58.2
          /tmp/omg-playwright/node_modules/.bin/playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/omg-editorial-preview.log 2>&1 &
      - env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
          OMG_ART_READY: ${{ steps.assets.outputs.ready }}
        run: node scripts/editorial-approved-art-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-art-visual-evidence
          path: qa/approved-art/
      - name: Final artwork acceptance gate
        if: steps.assets.outputs.ready != 'true'
        run: |
          echo "::error::Final acceptance blocked until both approved images are transferred."
          exit 1
