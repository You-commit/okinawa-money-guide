name: SEO content final check

on:
  push:
    branches:
      - feature/seo-simulator-content-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Verify built SEO pages
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/knowledge/nisa-basics.html
          test -f dist/knowledge/mortgage-repayment-methods.html
          grep -F '<title>NISAの基本｜非課税枠と始める前に確認したいこと | 沖縄マネーガイド</title>' dist/knowledge/nisa-basics.html
          grep -F 'rel="canonical" href="https://okinawamoneyguide.jp/knowledge/nisa-basics"' dist/knowledge/nisa-basics.html
          grep -F 'name="robots" content="index, follow"' dist/knowledge/nisa-basics.html
          grep -F 'property="og:type" content="article"' dist/knowledge/nisa-basics.html
          grep -F '"@type":"Article"' dist/knowledge/nisa-basics.html
          grep -F 'rel="canonical" href="https://okinawamoneyguide.jp/knowledge/mortgage-repayment-methods"' dist/knowledge/mortgage-repayment-methods.html
          grep -F 'property="og:type" content="article"' dist/knowledge/mortgage-repayment-methods.html
          COUNT=$(grep -c '<loc>' dist/sitemap.xml)
          test "$COUNT" -eq 11
