name: NISA Article V2 Verify

on:
  push:
    branches:
      - feature/nisa-article-design-v1

jobs:
  verify-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Article route regression tests
        run: npx vitest run src/AppRouter.test.tsx src/app/seo.test.ts

      - name: Full test suite diagnostic
        id: full_design
        continue-on-error: true
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Diff check
        run: git diff --check origin/feature/article-metadata-20261004...HEAD

      - name: Report full-suite outcome
        if: always()
        run: echo "Design full-suite outcome=${{ steps.full_design.outcome }}"

  verify-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metadata base
        uses: actions/checkout@v4
        with:
          ref: feature/article-metadata-20261004
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite on base diagnostic
        id: full_base
        continue-on-error: true
        run: npm test

      - name: Report base outcome
        if: always()
        run: echo "Base full-suite outcome=${{ steps.full_base.outcome }}"
