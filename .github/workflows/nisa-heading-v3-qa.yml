name: NISA compact editorial heading acceptance
on:
  push:
    branches: [preview/nisa-heading-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Protect all other source and enforce CSS scope
        run: |
          git diff --exit-code 5d0e2b4aa0ca6b2f1b2fd18d44961023f40a6b11 HEAD -- src ':!src/styles/editorial-consistency.css'
          node scripts/check-editorial-scope.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: |
          npm install --prefix /tmp/omg-playwright --no-save playwright@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=ja
          /tmp/omg-playwright/node_modules/.bin/playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/nisa-heading-preview.log 2>&1 &
      - name: Verify chart and navigation regression
        env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
        run: node scripts/nisa-chart-accuracy-qa.mjs
      - name: Verify compact heading on actual deployed website
        env:
          OMG_PLAYWRIGHT_MODULE: /tmp/omg-playwright/node_modules/playwright/index.mjs
        run: node scripts/nisa-heading-v3-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nisa-heading-v3-visual-evidence
          path: |
            qa/nisa-heading/
            qa/nisa-chart/report.json
