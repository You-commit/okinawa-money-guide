name: NISA Nav CTA Placement QA r2

on:
  push:
    branches:
      - qa/nisa-nav-cta-placement-20261014-r2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Route and integration tests
        run: npm test -- src/AppRouter.test.tsx

      - name: Current Mortgage test
        continue-on-error: true
        run: npm test -- src/MortgageCalculator.test.tsx --reporter=verbose

      - name: Baseline Mortgage test
        continue-on-error: true
        run: |
          git worktree add /tmp/omg-baseline 9c421a73a295b42054426b8c11fdad19826d3f15
          cd /tmp/omg-baseline
          npm ci
          npm test -- src/MortgageCalculator.test.tsx --reporter=verbose

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check 9c421a73a295b42054426b8c11fdad19826d3f15 53ce4b1da610f29345bcc5eb2dd9d3d4df0cb49f

      - name: Full test suite
        continue-on-error: true
        run: npm test -- --reporter=verbose

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/omg-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omg-preview.log
          exit 1

      - name: Capture NISA placement screenshots
        run: |
          mkdir -p qa-placement-screenshots
          cat > qa-placement.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve('qa-placement-screenshots');
          const base = 'http://127.0.0.1:4173';

          async function capture(mode, viewport, isMobile) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport, isMobile, hasTouch: isMobile, deviceScaleFactor: 1, locale: 'ja-JP',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()) });

            await page.goto(base + '/knowledge/nisa-limits-and-future-value', { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(1000);

            const metrics = await page.evaluate(() => {
              const nav = document.querySelector('.nisa-guide-local-nav-shell');
              const article = document.querySelector('.nisa-guide-layout');
              const sticky = document.querySelector('.nisa-guide-sticky-cta');
              const hero = document.querySelector('.knowledge-article-hero');
              const nr = nav?.getBoundingClientRect();
              const ar = article?.getBoundingClientRect();
              const sr = sticky?.getBoundingClientRect();
              const hr = hero?.getBoundingClientRect();
              return {
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                heroBottom: hr?.bottom ?? null,
                navTop: nr?.top ?? null,
                navBottom: nr?.bottom ?? null,
                articleTop: ar?.top ?? null,
                stickyTop: sr?.top ?? null,
                stickyBottom: sr?.bottom ?? null,
                viewportHeight: window.innerHeight,
                headerCount: document.querySelectorAll('.top-option02__header').length,
                footerCount: document.querySelectorAll('.site-footer').length,
                primaryStickyCount: document.querySelectorAll('.nisa-guide-sticky-cta .nisa-guide-primary-action').length,
                secondaryStickyCount: document.querySelectorAll('.nisa-guide-sticky-cta .nisa-guide-secondary-action').length,
              };
            });

            await page.screenshot({ path: path.join(out, mode + '-nisa-top.png'), fullPage: false, animations: 'disabled' });
            await page.screenshot({ path: path.join(out, mode + '-nisa-full.png'), fullPage: true, animations: 'disabled' });
            fs.writeFileSync(path.join(out, mode + '-metrics.json'), JSON.stringify({ viewport, metrics, errors }, null, 2));

            await page.goto(base + '/knowledge/mortgage-comparison', { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(500);
            await page.screenshot({ path: path.join(out, mode + '-mortgage-top.png'), fullPage: false, animations: 'disabled' });

            await browser.close();
          }

          (async () => {
            await capture('desktop', { width: 1440, height: 900 }, false);
            await capture('mobile', { width: 390, height: 844 }, true);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node qa-placement.cjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-placement-screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: capture NISA nav and CTA placement r2 [skip ci]"
          git push origin HEAD:qa/nisa-nav-cta-placement-20261014-r2
