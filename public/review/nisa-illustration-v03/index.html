<script>
/* Interactive editorial mock — for user visual acceptance only. No repository writes. */
const formatYen = value => Math.round(value).toLocaleString('ja-JP') + '円';
const conditions = { principal: 30000000, annualRate: 0.01, months: 35 * 12 };

    const details=el.closest('details');if(details)details.open=false;
  });
  window.scrollTo({top:0,behavior:'instant'});
  if(keepFocus)document.getElementById('article-title').focus({preventScroll:true});
  const url=new URL(location.href);url.searchParams.set('article',id);try { history.replaceState(null,'',url.href); } catch { /* file:// での閲覧時は表示を優先 */ }
}
controls.forEach(el=>el.addEventListener('click',()=>renderArticle(el.dataset.article,true)));
const panel=document.getElementById('review-panel'),show=document.getElementById('review-show');
function setReviewShown(visible){panel.hidden=!visible;show.hidden=visible;const u=new URL(location.href);if(!visible)u.searchParams.set('mode','clean');else u.searchParams.delete('mode');try { history.replaceState(null,'',u.href); } catch { /* file:// での閲覧時は表示を優先 */ }}
document.getElementById('review-hide').addEventListener('click',()=>setReviewShown(false));
show.addEventListener('click',()=>setReviewShown(true));
const params=new URL(location.href).searchParams;
renderArticle(params.get('article')==='mortgage'?'mortgage':'nisa');
if(params.get('mode')==='clean')setReviewShown(false);

</script>
</body>
